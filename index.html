<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corrida Infinita</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0f1224;--text:#fff7e0;--gold:#ffcf3f;--btn:#ff6b3d}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Trebuchet MS",system-ui,sans-serif;
  display:flex;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:100%;max-width:480px;height:100dvh}
canvas{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px;text-align:center;background:rgba(15,18,36,.72)}
#ov h1{margin:0;font-size:2.3rem;line-height:1.1}
#ov p{margin:0;max-width:300px;line-height:1.45;font-size:1rem}
#go{font:inherit;font-size:1.2rem;font-weight:700;color:#2a1000;background:var(--btn);border:0;border-radius:14px;
  padding:14px 38px;cursor:pointer}
#go:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#ov{background:radial-gradient(circle at 50% 35%,rgba(106,47,122,.55),rgba(15,18,36,.88));backdrop-filter:blur(5px)}
#ov h1{font-size:2.6rem;color:var(--gold);text-shadow:0 3px 0 #b8541a,0 8px 24px rgba(0,0,0,.5)}
#go{box-shadow:0 5px 0 #a8431c,0 10px 24px rgba(0,0,0,.4);transition:transform .08s}
#go:active{transform:translateY(3px);box-shadow:0 2px 0 #a8431c}
.rw{display:flex;gap:10px}
#shopb,#back,.sk button{font:inherit;font-weight:700;border-radius:14px;cursor:pointer;color:var(--gold);background:transparent;border:2px solid var(--gold);padding:12px 26px;font-size:1.1rem}
#bank{color:var(--gold);font-weight:700}
#cr{opacity:.75;font-size:.85rem}
#shop{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;gap:12px;padding:22px 16px;background:rgba(15,18,36,.96);overflow-y:auto;touch-action:pan-y}
#shop h2{margin:0;font-size:1.8rem;color:var(--gold)}
#wal{font-weight:700}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%}
.sk{background:#232846;border-radius:16px;padding:10px;text-align:center;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:6px}
.sk.sel{border-color:var(--gold)}
.sk canvas{width:80px;height:80px}
.sk .nm{font-weight:700}
.sk button{padding:8px 12px;font-size:.9rem;width:100%}
.sk button:disabled{opacity:.45;cursor:default}
#ov{justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px 30px;background:linear-gradient(rgba(15,18,36,.88),rgba(15,18,36,0) 34%,rgba(15,18,36,0) 52%,rgba(15,18,36,.9));backdrop-filter:none}
#ov .top,#ov .bot{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
#ov h1{font-size:2.9rem;font-style:italic;text-transform:uppercase;line-height:.95}
#ov #d{display:none;max-width:none;background:rgba(15,18,36,.85);border:2px solid var(--gold);border-radius:18px;padding:14px 26px;text-align:left;line-height:1.8;font-size:1.1rem}
#d b{color:var(--gold)}
#bank{background:rgba(15,18,36,.6);border-radius:999px;padding:6px 18px}
#ov #go{background:linear-gradient(#5ff07b,#1fae3f);color:#073d14;font-size:1.9rem;letter-spacing:1px;text-transform:uppercase;padding:16px 60px;border-radius:18px;box-shadow:0 6px 0 #137a2b,0 12px 26px rgba(0,0,0,.45);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){#ov #go{animation:none}}
#hint{opacity:.85;max-width:300px;text-align:center}
#mute{position:absolute;right:12px;bottom:14px;z-index:5;width:44px;height:44px;padding:0;border-radius:50%;border:2px solid var(--gold);background:rgba(15,18,36,.6);color:var(--text);font-size:1.2rem;cursor:pointer}
</style>


</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <button id="mute" aria-label="Ligar ou desligar o som">🔊</button>
  <div id="ov">
    <div class="top"><h1 id="t">Corrida Infinita</h1><div id="bank"></div></div>
    <p id="d"></p>
    <div class="bot">
      <button id="go">Jogar</button>
      <button id="shopb">Loja</button>
      <small id="hint">Deslize para os lados, para cima (pular) e para baixo (deslizar). No teclado, use as setas.</small>
      <small id="cr"></small>
    </div>
  </div>
  <div id="shop">
    <h2>Loja de skins</h2>
    <div id="wal"></div>
    <div id="grid"></div>
    <button id="back">Voltar</button>
  </div>
</div>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
var W=0,H=0,HZ=0,PT=0.82,dpr=1,bg=null;
function resize(){var d=dpr=Math.min(window.devicePixelRatio||1,2);bg=null;var r=cv.getBoundingClientRect();W=r.width;H=r.height;HZ=H*0.25;
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
window.addEventListener('resize',resize);resize();

function hw(t){return W*(0.12+0.37*t)}
function P(l,t){var lw=2*hw(t)/3;return{x:W/2+(l-1)*lw,y:HZ+(H-HZ)*t,u:lw*0.75}}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}

var state='menu',best=0,objs,lane,px,jumpT,slideT,speed,score,coins,dist,spawnT,phase,runP,noCoin,pauseT,gotCoin;
try{best=+localStorage.getItem('ci-best')||0}catch(e){}

function reset(){objs=[];lane=1;px=1;jumpT=0;slideT=0;speed=0.75;score=0;coins=0;noCoin=0;pauseT=0;gotCoin=false;dist=0;spawnT=0.2;phase=0;runP=0}
reset();

function spawn(){
  var ls=[0,1,2].sort(function(){return Math.random()-.5}),r=Math.random(),types=['low','high','block'];
  function ob(l){objs.push({k:types[Math.floor(Math.random()*3)],l:l,t:0.02,c:Math.floor(Math.random()*5)})}
  function line(l,n){for(var i=0;i<n;i++)objs.push({k:'coin',l:l,t:0.02-i*0.045})}
  if(r<0.45){ob(ls[0]);line(ls[1],5)}
  else if(r<0.75){ob(ls[0]);ob(ls[1]);line(ls[2],4)}
  else{line(ls[0],7)}
}

function start(){ac();SFX.click();reset();musicT=0;mi=0;state='play';ov.style.display='none'}
function end(){
  state='over';SFX.crash();wallet+=coins;save();
  if(score>best){best=score;try{localStorage.setItem('ci-best',best)}catch(e){}}
  document.getElementById('t').textContent='Fim de jogo';
  var dd=document.getElementById('d');dd.style.display='block';dd.innerHTML='<b>Pontos</b> '+score+'<br><b>Moedas</b> '+coins+'<br><b>Tempo sem moedas</b> '+noCoin.toFixed(1)+' s<br><b>Recorde</b> '+best;
  document.getElementById('go').textContent='Jogar de novo';refreshMenu();
  ov.style.display='flex';
}
function act(a){
  if(state!=='play')return;
  if(a==='L'&&lane>0){lane--;SFX.lane()}
  if(a==='R'&&lane<2){lane++;SFX.lane()}
  if(a==='U'&&jumpT===0){jumpT=0.001;slideT=0;SFX.jump()}
  if(a==='D'){jumpT=0;slideT=0.6;SFX.slide()}
}
document.getElementById('go').addEventListener('click',start);
window.addEventListener('keydown',function(e){if(e.key==='Enter'&&state!=='play'&&ov.style.display!=='none')start()});
window.addEventListener('keydown',function(e){
  var m={ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R',ArrowUp:'U',w:'U',' ':'U',ArrowDown:'D',s:'D'};
  if(m[e.key]){e.preventDefault();act(m[e.key])}
});
var sx=0,sy=0;
cv.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchend',function(e){
  var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
  if(Math.abs(dx)>Math.abs(dy))act(dx>0?'R':'L');else act(dy<0?'U':'D');
},{passive:true});

function update(dt){
  speed=0.75+Math.min(score,1200)/1200*0.95;
  phase=(phase+speed*dt*0.5)%1;scrollZ+=speed*dt*0.5*10/14;runP+=dt*speed*9;if(!gotCoin)noCoin+=dt;
  dist+=dt*speed;score=Math.floor(dist*10)+coins*10;
  px+=(lane-px)*Math.min(1,dt*14);
  if(jumpT>0){jumpT+=dt;if(jumpT>0.7)jumpT=0}
  if(slideT>0){slideT-=dt;if(slideT<0)slideT=0}
  musicT-=dt;if(musicT<=0){music();musicT=0.17/(0.75+speed*0.25)}spawnT-=dt;if(spawnT<=0){spawn();spawnT=1.05/speed}
  var jh=jumpT>0?Math.sin(Math.PI*jumpT/0.7):0;
  for(var i=objs.length-1;i>=0;i--){
    var o=objs[i];o.t+=speed*(0.2+1.2*Math.max(o.t,0))*dt;
    if(o.t>1.2){objs.splice(i,1);continue}
    if(o.l!==lane||Math.abs(o.t-PT)>0.045||o.t<0)continue;
    if(o.k==='coin'){if(jh<0.3){coins++;gotCoin=true;SFX.coin();objs.splice(i,1)}}
    else if(o.k==='block'||(o.k==='low'&&jh<0.3)||(o.k==='high'&&slideT===0)){end();return}
  }
}

var stars=[],bl=[],bn=[];
for(var si=0;si<45;si++)stars.push([Math.random(),Math.random()*0.55,0.5+Math.random()]);
(function(){var x=0,w;while(x<1.2){w=0.06+Math.random()*0.08;bl.push([x,w,0.25+Math.random()*0.55]);x+=w}
x=0;while(x<1.2){w=0.08+Math.random()*0.09;bn.push([x,w,0.2+Math.random()*0.5]);x+=w}})();
function sh(x,y,w){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x,y,w,w*0.22,0,0,7);ctx.fill()}
var AUTOR='Feito por Johnny';
var SK=[
{id:0,n:'Clássico',p:0,a:'#2fe0bf',b:'#119c82',h:'#e63946',k:'#ffd7a8',l:'#26304f'},
{id:1,n:'Fogo',p:50,a:'#ff8a3d',b:'#d6371f',h:'#ffd23f',k:'#ffd7a8',l:'#4a1d12'},
{id:2,n:'Neon',p:100,a:'#c77dff',b:'#7b2cbf',h:'#00f5d4',k:'#ffd7a8',l:'#2a1646'},
{id:3,n:'Ninja',p:150,a:'#3a3f58',b:'#1c1f30',h:'#e63946',k:'#d9a877',l:'#111'},
{id:4,n:'Ouro',p:300,a:'#ffe066',b:'#e0a100',h:'#fff7e0',k:'#ffd7a8',l:'#7a5a00'}];
var wallet=0,owned=[0],skin=0,CAR=['#e63946','#f4a300','#3a82f0','#2fbf71','#9b5de5'];
try{wallet=+localStorage.getItem('ci-w')||0;owned=JSON.parse(localStorage.getItem('ci-o')||'[0]');skin=+localStorage.getItem('ci-s')||0}catch(e){}
function save(){try{localStorage.setItem('ci-w',wallet);localStorage.setItem('ci-o',JSON.stringify(owned));localStorage.setItem('ci-s',skin)}catch(e){}}
var CD=CAR.map(function(c){return shade(c,-60)});
function shade(h,a){var n=parseInt(h.slice(1),16),f=function(v){return Math.max(0,Math.min(255,v+a))};
  return 'rgb('+f((n>>16)&255)+','+f((n>>8)&255)+','+f(n&255)+')'}
function star(x,y,R){ctx.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,r=i%2?R*0.45:R;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath();ctx.fill()}
var AC=null,muted=false,musicT=0,mi=0;
try{muted=localStorage.getItem('ci-m')==='1'}catch(e){}
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f1,f2,dur,type,vol,delay){var c=AC;if(!c||muted)return;var t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);if(f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02)}
function noise(dur,vol,f){var c=AC;if(!c||muted)return;var n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=c.createBufferSource(),g=c.createGain(),fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;g.gain.value=vol;
  s.buffer=b;s.connect(fl);fl.connect(g);g.connect(c.destination);s.start()}
var SFX={
  coin:function(){tone(988,988,0.09,'square',0.05,0);tone(1319,1319,0.18,'square',0.05,0.08)},
  jump:function(){tone(300,720,0.2,'triangle',0.12,0)},
  slide:function(){noise(0.3,0.15,900)},
  lane:function(){tone(230,160,0.07,'triangle',0.08,0)},
  crash:function(){noise(0.6,0.5,700);tone(160,40,0.5,'sawtooth',0.15,0)},
  buy:function(){tone(660,660,0.08,'square',0.06,0);tone(880,880,0.08,'square',0.06,0.08);tone(1320,1320,0.22,'square',0.06,0.16)},
  click:function(){tone(500,500,0.05,'square',0.05,0)}};
var MN=[220,0,262,0,330,0,262,0,196,0,247,0,294,0,247,0];
function music(){var n=MN[mi%16],b=mi%8<4?110:98;if(n)tone(n,n,0.12,'triangle',0.05,0);if(mi%4===0)tone(b,b,0.28,'sine',0.09,0);mi++}
var mb=document.getElementById('mute');
mb.textContent=muted?'🔇':'🔊';
mb.addEventListener('click',function(){muted=!muted;mb.textContent=muted?'🔇':'🔊';try{localStorage.setItem('ci-m',muted?'1':'0')}catch(e){}if(!muted){ac();SFX.click()}});
function stripes(x0,y0,w,h,u,col){ctx.save();rr(x0,y0,w,h,u*0.05);ctx.clip();ctx.fillStyle=col;
  for(var i=-1;i<5;i++){var bx=x0+i*u*0.3;ctx.beginPath();ctx.moveTo(bx,y0+h);ctx.lineTo(bx+u*0.12,y0+h);ctx.lineTo(bx+u*0.12+h*0.4,y0);ctx.lineTo(bx+h*0.4,y0);ctx.fill()}ctx.restore()}
function drawObj(o){
  var p=P(o.l,o.t),u=p.u,x=p.x,y=p.y,g,now=performance.now();
  ctx.globalAlpha=Math.min(1,o.t*25);
  if(o.k==='coin'){
    var s=Math.abs(Math.cos(now/240+o.l*2)),r=u*0.24,cy=y-u*0.55,w=r*(0.2+0.8*s),sp=(Math.sin(now/300+o.l)+1)/2;
    sh(x,y,r);
    ctx.fillStyle='#a85f00';ctx.beginPath();ctx.ellipse(x+r*0.1,cy+r*0.07,w,r,0,0,7);ctx.fill();
    ctx.fillStyle='#ffc21a';ctx.beginPath();ctx.ellipse(x,cy,w,r,0,0,7);ctx.fill();
    ctx.strokeStyle='#fff3a8';ctx.lineWidth=Math.max(1,u*0.03);ctx.beginPath();ctx.ellipse(x,cy,w*0.74,r*0.74,0,0,7);ctx.stroke();
    if(s>0.4){ctx.fillStyle='#d98300';star(x,cy,r*0.45*Math.min(1,s*1.4))}
    ctx.fillStyle='rgba(255,255,255,'+sp+')';ctx.fillRect(x+r*0.55,cy-r*1.15,u*0.03,u*0.15);ctx.fillRect(x+r*0.55-u*0.06,cy-r*1.15+u*0.06,u*0.15,u*0.03);
  }else if(o.k==='low'){
    sh(x,y,u*0.58);
    ctx.fillStyle='#3d4260';rr(x-u*0.42,y-u*0.16,u*0.12,u*0.16,u*0.03);ctx.fill();rr(x+u*0.3,y-u*0.16,u*0.12,u*0.16,u*0.03);ctx.fill();
    g=ctx.createLinearGradient(0,y-u*0.5,0,y-u*0.14);g.addColorStop(0,'#ffb347');g.addColorStop(1,'#e8581a');
    rr(x-u*0.52,y-u*0.5,u*1.04,u*0.36,u*0.07);ctx.fillStyle=g;ctx.fill();
    stripes(x-u*0.52,y-u*0.5,u*1.04,u*0.36,u,'#fff7e0');
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x-u*0.5,y-u*0.48,u,u*0.04);
    ctx.fillStyle=Math.floor(now/250)%2?'#ffe14a':'#8a6d00';ctx.beginPath();ctx.arc(x,y-u*0.56,u*0.07,0,7);ctx.fill();
  }else if(o.k==='high'){
    sh(x,y,u*0.6);
    ctx.fillStyle='#6b708a';ctx.fillRect(x-u*0.52,y-u*1.5,u*0.1,u*1.5);ctx.fillRect(x+u*0.42,y-u*1.5,u*0.1,u*1.5);
    g=ctx.createLinearGradient(0,y-u*1.5,0,y-u*1.05);g.addColorStop(0,'#1f9d5a');g.addColorStop(1,'#126b3b');
    rr(x-u*0.56,y-u*1.5,u*1.12,u*0.46,u*0.06);ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle='#fff7e0';ctx.lineWidth=Math.max(1,u*0.03);rr(x-u*0.52,y-u*1.46,u*1.04,u*0.38,u*0.04);ctx.stroke();
    ctx.fillStyle='#fff7e0';ctx.beginPath();ctx.moveTo(x-u*0.14,y-u*1.3);ctx.lineTo(x+u*0.14,y-u*1.3);ctx.lineTo(x,y-u*1.13);ctx.fill();
    ctx.fillStyle=Math.floor(now/300)%2?'#ffe14a':'#8a6d00';ctx.beginPath();ctx.arc(x-u*0.4,y-u*1.56,u*0.06,0,7);ctx.arc(x+u*0.4,y-u*1.56,u*0.06,0,7);ctx.fill();
  }else{
    var ci=(o.c||0)%5,c=CAR[ci];
    sh(x,y,u*0.68);
    ctx.fillStyle='#14141c';rr(x-u*0.52,y-u*0.34,u*0.16,u*0.34,u*0.04);ctx.fill();rr(x+u*0.36,y-u*0.34,u*0.16,u*0.34,u*0.04);ctx.fill();
    g=ctx.createLinearGradient(x-u*0.5,0,x+u*0.5,0);g.addColorStop(0,CD[ci]);g.addColorStop(0.5,c);g.addColorStop(1,CD[ci]);
    ctx.fillStyle=g;rr(x-u*0.52,y-u*0.95,u*1.04,u*0.68,u*0.1);ctx.fill();rr(x-u*0.42,y-u*1.6,u*0.84,u*0.75,u*0.17);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.22)';rr(x-u*0.36,y-u*1.58,u*0.72,u*0.07,u*0.03);ctx.fill();
    ctx.fillStyle='#16233f';rr(x-u*0.34,y-u*1.5,u*0.68,u*0.46,u*0.1);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.moveTo(x-u*0.3,y-u*1.46);ctx.lineTo(x-u*0.08,y-u*1.46);ctx.lineTo(x-u*0.2,y-u*1.08);ctx.lineTo(x-u*0.3,y-u*1.08);ctx.fill();
    [-1,1].forEach(function(sd){var lx=x+sd*u*0.36,gl=0;ctx.fillStyle='rgba(255,60,70,.28)';ctx.beginPath();ctx.arc(lx,y-u*0.78,u*0.22,0,7);ctx.fill();
      ctx.fillStyle='#ff2a3a';rr(lx-u*0.11,y-u*0.85,u*0.22,u*0.14,u*0.04);ctx.fill()});
    ctx.fillStyle='#f4f1e6';rr(x-u*0.17,y-u*0.64,u*0.34,u*0.14,u*0.03);ctx.fill();ctx.fillStyle='#2456b8';ctx.fillRect(x-u*0.17,y-u*0.64,u*0.34,u*0.035);
    ctx.fillStyle='#1d1d28';rr(x-u*0.54,y-u*0.42,u*1.08,u*0.14,u*0.05);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function runner(x,y,u,s,sw,sl){
  var g,la=Math.max(0,sw)*0.7,ra=Math.max(0,-sw)*0.7;
  ctx.save();
  if(sl){ctx.translate(x,y);ctx.scale(1.15,0.55);ctx.translate(-x,-y)}

function drawPlayer(){
  var p=P(1,PT),u=p.u,x=W/2+(px-1)*(2*hw(PT)/3);

var shopEl=document.getElementById('shop');

var scrollZ=0,BC=['#3a3560','#33426b','#4d3558','#2f4f5a','#4a4238'];
var BS=BC.map(function(c){return shade(c,-35)});
function rnd(a,s){var x=Math.sin(a*127.1+s*311.7)*43758.5453;return x-Math.floor(x)}
function city(){
  var N=10,base=Math.floor(scrollZ),fr=scrollZ-base,i,sd;
  [-1,1].forEach(function(sd){ctx.fillStyle='#5b5a74';ctx.beginPath();
    ctx.moveTo(W/2+sd*hw(0)*1.08,HZ);ctx.lineTo(W/2+sd*hw(0)*1.35,HZ);ctx.lineTo(W/2+sd*hw(1)*1.35,H);ctx.lineTo(W/2+sd*hw(1)*1.08,H);ctx.fill()});
  for(i=0;i<N;i++){
    var w=base+i,f=(N-1-i+fr)/N;
    [-1,1].forEach(function(sd){
      var id=w*2+(sd>0?1:0),hf=0.9+rnd(id,1)*1.7,ci=Math.floor(rnd(id,2)*5),col=BC[ci],
        fB=Math.max(0,f-0.8/N),tF=f*f,tB=fB*fB,hwF=hw(tF),hwB=hw(tB),
        xF=W/2+sd*hwF*1.35,xB=W/2+sd*hwB*1.35,yF=HZ+(H-HZ)*tF,yB=HZ+(H-HZ)*tB,
        bhF=hwF*hf,bhB=hwB*hf,wd=hwF*1.1*sd,rows=Math.max(2,Math.round(hf*1.5)),r,c;
      if(tF<0.0004||rnd(id,5)<0.45)return;
      ctx.fillStyle=BS[ci];ctx.beginPath();ctx.moveTo(xB,yB);ctx.lineTo(xF,yF);ctx.lineTo(xF,yF-bhF);ctx.lineTo(xB,yB-bhB);ctx.fill();
      var x0=Math.min(xF,xF+wd),aw=Math.abs(wd),cw=aw/3,ch=bhF/rows;
      ctx.fillStyle=col;ctx.fillRect(x0,yF-bhF,aw,bhF);
      ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(x0,yF-bhF,aw,Math.max(1,bhF*0.012));
      function cn(u,v){var t=tB+(tF-tB)*u,hh=hw(t);return [W/2+sd*hh*1.35,HZ+(H-HZ)*t-v*hh*hf]}
      for(r=0;r<rows;r++)for(c=0;c<3;c++){
        var lit=rnd(id*31+r*7+c,3)>0.45;
        
        
        var lit2=rnd(id*17+r*5+c,4)>0.55,v0=r/rows+0.2/rows,v1=(r+1)/rows-0.25/rows,u0=c/3+0.07,u1=(c+1)/3-0.07,
          a=cn(u0,v0),b=cn(u1,v0),e=cn(u1,v1),d=cn(u0,v1);
        if(!lit2)continue;ctx.fillStyle='rgba(255,200,110,.7)';
        ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(e[0],e[1]);ctx.lineTo(d[0],d[1]);ctx.fill();
      }
      if(w%4===0){
        var fl=Math.max(0,f-0.4/N),tl=fl*fl,hl=hw(tl),lx=W/2+sd*hl*1.2,ly=HZ+(H-HZ)*tl,hx=lx-sd*hl*0.15,hy=ly-hl*0.95;
        ctx.strokeStyle='#2b2b3a';ctx.lineWidth=Math.max(1,hl*0.03);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx,ly-hl*0.9);ctx.lineTo(hx,hy);ctx.stroke();
        ctx.fillStyle='rgba(255,225,150,.35)';ctx.beginPath();ctx.arc(hx,hy,hl*0.22,0,7);ctx.fill();ctx.fillStyle='rgba(255,240,190,.95)';ctx.beginPath();ctx.arc(hx,hy,hl*0.07,0,7);ctx.fill();
      }
    });
  }
}
function pill(x,y,w,h){ctx.fillStyle='rgba(15,18,36,.55)';rr(x,y,w,h,h/2);ctx.fill()}
function skyline(arr,col,hm,par,win){
  var off=(px-1)*-W*0.02*par;ctx.fillStyle=col;
  arr.forEach(function(b,i){var bx=b[0]*W+off,bw=b[1]*W,bh=HZ*hm*b[2];ctx.fillRect(bx,HZ-bh,bw+1,bh);
    if(win){ctx.fillStyle='rgba(255,214,120,.55)';
      for(var r=0;r<bh/9-1;r++)for(var c=0;c<bw/8-1;c++)if((i*7+r*3+c*5)%4===0)ctx.fillRect(bx+4+c*8,HZ-bh+5+r*9,3,4);
      ctx.fillStyle=col}});
}
function buildBg(){var old=ctx,pxs=px,c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;bg=c;ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);px=1;
  var g=ctx.createLinearGradient(0,0,0,HZ),now=performance.now()/1000,N=14;
  g.addColorStop(0,'#120f3a');g.addColorStop(0.55,'#6a2f7a');g.addColorStop(1,'#ff9a5c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HZ+1);
  stars.forEach(function(s){ctx.fillStyle='rgba(255,247,224,'+(0.3+0.5*Math.abs(Math.sin(now*s[2]+s[0]*9)))+')';ctx.fillRect(s[0]*W,s[1]*HZ,1.5,1.5)});
  g=ctx.createRadialGradient(W*0.7,HZ,0,W*0.7,HZ,W*0.3);g.addColorStop(0,'#fff0b0');g.addColorStop(0.25,'#ffc36b');g.addColorStop(1,'rgba(255,154,92,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HZ+1);
  skyline(bl,'#3a2358',0.9,0.5,false);skyline(bn,'#221838',0.75,1,false);
  g=ctx.createLinearGradient(0,HZ,0,H);g.addColorStop(0,'#1d2a3a');g.addColorStop(1,'#0e1a1f');
  ctx.fillStyle=g;ctx.fillRect(0,HZ,W,H-HZ);
  g=ctx.createLinearGradient(0,HZ,0,H);g.addColorStop(0,'#4a4668');g.addColorStop(1,'#2c2a40');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(W/2-hw(0),HZ);ctx.lineTo(W/2+hw(0),HZ);ctx.lineTo(W/2+hw(1),H);ctx.lineTo(W/2-hw(1),H);ctx.fill();
  px=pxs;ctx=old}
function draw(){var g,N=14;if(!bg)buildBg();ctx.drawImage(bg,0,0,W,H);
  for(var k=0;k<N;k++){
    var f=(k/N+phase/N)%1,fa=f*f,fb=Math.min(1,(f+1/N)*(f+1/N)),fd=Math.min(1,(f+0.45/N)*(f+0.45/N));
    ctx.fillStyle=k%2?'#e63946':'#fff7e0';
    [-1,1].forEach(function(sd){
      var xa=W/2+sd*hw(fa),xb=W/2+sd*hw(fb),ya=HZ+(H-HZ)*fa,yb=HZ+(H-HZ)*fb;
      ctx.beginPath();ctx.moveTo(xa,ya);ctx.lineTo(xb,yb);ctx.lineTo(xb+sd*hw(fb)*0.08,yb);ctx.lineTo(xa+sd*hw(fa)*0.08,ya);ctx.fill()});
    ctx.fillStyle='rgba(255,247,224,.8)';
    [0.5,1.5].forEach(function(l){
      var a=P(l,fa),c=P(l,fd),wa=Math.max(1,hw(fa)*0.015),wc=Math.max(1,hw(fd)*0.015);
      ctx.beginPath();ctx.moveTo(a.x-wa,a.y);ctx.lineTo(a.x+wa,a.y);ctx.lineTo(c.x+wc,c.y);ctx.lineTo(c.x-wc,c.y);ctx.fill()});
  }
  city();g=ctx.createLinearGradient(0,HZ,0,HZ+(H-HZ)*0.25);g.addColorStop(0,'rgba(255,154,92,.55)');g.addColorStop(1,'rgba(255,154,92,0)');
  ctx.fillStyle=g;ctx.fillRect(0,HZ,W,(H-HZ)*0.25);
  var done=false;for(var oi=objs.length-1;oi>=0;oi--){var o=objs[oi];if(o.t<=0)continue;if(!done&&o.t>PT){drawPlayer();done=true}drawObj(o)}if(!done)drawPlayer();
  var ff='"Trebuchet MS",system-ui,sans-serif';if(state!=='play')return;
  pill(12,12,120,38);pill(W-100,12,88,38);pill(12,56,150,28);
  ctx.textBaseline='middle';ctx.font='700 22px '+ff;ctx.fillStyle='#fff7e0';ctx.textAlign='left';ctx.fillText(String(score),26,32);
  ctx.fillStyle='#ffcf3f';ctx.beginPath();ctx.arc(W-82,31,8,0,7);ctx.fill();ctx.textAlign='right';ctx.fillText(String(coins),W-24,32);
  ctx.font='600 14px '+ff;ctx.textAlign='left';ctx.fillStyle=gotCoin?'#7dffa0':(noCoin>6?'#ffb36b':'#fff7e0');
  ctx.fillText('Sem moedas: '+noCoin.toFixed(1)+' s',24,71);ctx.textBaseline='alphabetic';
}

var last=0;
function loop(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(state==='play')update(dt);else{scrollZ+=dt*0.12;phase=(phase+dt*0.17)%1;runP+=dt*3}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
